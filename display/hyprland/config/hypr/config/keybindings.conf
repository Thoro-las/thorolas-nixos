# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, T, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod CTRL SHIFT, M, exit,
bind = $mainMod, R, exec, $menu
bind = $mainMod, x, exec, wlogout -p layer-shell -b 6 &
bind = $mainMod SHIFT, l, exec, hyprlock &

bind = $mainMod, space, fullscreen
bind = $mainMod CTRL, space, togglefloating

bind = $mainMod CTRL ALT, space, setfloating
bind = $mainMod CTRL ALT, space, pin

# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

binde = $mainMod SHIFT ALT, h, moveactive, -20 0
binde = $mainMod SHIFT ALT, l, moveactive, 20 0
binde = $mainMod SHIFT ALT, k, moveactive, 0 -20
binde = $mainMod SHIFT ALT, j, moveactive, 0 20

binde = $mainMod CTRL ALT, h, resizeactive, -20 0
binde = $mainMod CTRL ALT, l, resizeactive, 20 0
binde = $mainMod CTRL ALT, k, resizeactive, 0 -20
binde = $mainMod CTRL ALT, j, resizeactive, 0 20

bind = $mainMod CTRL SHIFT ALT, h, swapwindow, l
bind = $mainMod CTRL SHIFT ALT, l, swapwindow, r
bind = $mainMod CTRL SHIFT ALT, k, swapwindow, u
bind = $mainMod CTRL SHIFT ALT, j, swapwindow, d

bind = $mainMod, tab, cyclenext
bind = $mainMod CTRL, tab, cyclenext, prev

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, code:10, workspace, 1
bind = $mainMod, code:11, workspace, 2
bind = $mainMod, code:12, workspace, 3
bind = $mainMod, code:13, workspace, 4
bind = $mainMod, code:14, workspace, 5
bind = $mainMod, code:15, workspace, 6
bind = $mainMod, code:16, workspace, 7
bind = $mainMod, code:17, workspace, 8

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, code:10, movetoworkspace, 1
bind = $mainMod SHIFT, code:11, movetoworkspace, 2
bind = $mainMod SHIFT, code:12, movetoworkspace, 3
bind = $mainMod SHIFT, code:13, movetoworkspace, 4
bind = $mainMod SHIFT, code:14, movetoworkspace, 5
bind = $mainMod SHIFT, code:15, movetoworkspace, 6
bind = $mainMod SHIFT, code:16, movetoworkspace, 7
bind = $mainMod SHIFT, code:17, movetoworkspace, 8

# Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, exec, hyprshot -m region --output-folder ~/Screenshots/
bind = $mainMod CTRL SHIFT, S, exec, hyprshot -m region --clipboard-only

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod CTRL, l, workspace, e+1
bind = $mainMod CTRL, h, workspace, e-1

bind = $mainMod CTRL SHIFT, l, movetoworkspace, e+1
bind = $mainMod CTRL SHIFT, h, movetoworkspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = SHIFT,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 1%+
bindel = SHIFT,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-

bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindel = ,XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-

bindel = SHIFT,XF86MonBrightnessUp, exec, brightnessctl set 1%+
bindel = SHIFT,XF86MonBrightnessDown, exec, brightnessctl set 1%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true
workspace = 5, persistent:true

bind = $mainMod, z, exec, zathura
bind = $mainMod, f, exec, brave
bind = $mainMod, v, exec, kitty -e nvim
bind = $mainMod, y, exec, kitty -e yazi
bind = $mainMod, d, exec, dolphin
bind = $mainMod, p, exec, thrpm
bind = $mainMod, m, exec, Telegram

# bind = $mainMod CTRL, n, exec, sh -c "networkmanager_dmenu"
bind = $mainMod CTRL, b, exec, sh -c "blueman-manager"
